spring.application.name=swayamcraft-backend
server.port=${PORT:8080}

# Spring Profiles: default is dev (H2), can switch to 'prod' for PostgreSQL
spring.profiles.active=dev

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom storage directory for uploaded craft images
app.upload.dir=./uploads

# JWT Security Configuration
app.jwt.secret=9a3f2c4e6b8a1d5f7e9c2b4a6d8f1e3c5a7b9d1f3e5a7c9b1d3f5a7c9e1b3d5f
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
